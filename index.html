<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advocate Of SHALOM | Grand Junction, CO</title>
    <!-- Static description fallback for crawlers/social-preview bots that don't
         execute JavaScript. useSeo.ts overrides this per-route at runtime. -->
    <meta name="description" content="Holistic advocacy for individuals navigating the criminal justice system, reentry, and complex government agencies — based in Grand Junction, Colorado." />

    <!-- Fonts -->
    <!-- Fonts self-hosted from /fonts/ — removes the DNS + TLS + extra
         stylesheet round-trip to fonts.googleapis.com + fonts.gstatic.com.
         Preload the 2 fonts on the critical path (400 body + 700 heading),
         inline @font-face rules so no separate CSS request is needed. -->
    <link rel="preload" href="/fonts/sourcesans3-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfairdisplay-700.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Latin subset only (all we need for en-US). font-display: swap
         keeps text visible with the system-font fallback while custom
         faces finish loading. */
      @font-face {
        font-family: 'Source Sans 3';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/sourcesans3-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Sans 3';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/sourcesans3-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Sans 3';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/sourcesans3-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/playfairdisplay-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/playfairdisplay-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/playfairdisplay-700.woff2') format('woff2');
      }
    </style>

    <!-- Sanity CDN preconnect — every image on the site comes from here -->
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Simple Analytics — cookieless, privacy-first -->
    <script async defer src="https://sa.advocateofshalom.com/latest.js"></script>
    <noscript><img src="https://sa.advocateofshalom.com/noscript.gif" alt="" referrerpolicy="no-referrer-when-downgrade" /></noscript>
  </body>
</html>
